[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-longrun-framework"
version = "0.3.0"
description = "Runtime contracts for long-running LLM agents: state machine, single-turn write lease, and project-scoped memory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "lss486558354-ship-it" },
]
keywords = [
    "agent",
    "mcp",
    "state-machine",
    "memory",
    "long-running",
    "llm",
    "checkpoint",
    "write-gate",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agent-longrun = "cli:main"

[project.urls]
Homepage = "https://github.com/lss486558354-ship-it/Agent-LongRun-Framework-v3"
Source = "https://github.com/lss486558354-ship-it/Agent-LongRun-Framework-v3"

[tool.setuptools]
py-modules = ["cli", "state_machine", "memory_client", "workflow_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".longrun", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
