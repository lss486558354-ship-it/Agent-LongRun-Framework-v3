name: Feature request
  description: Propose a change to the runtime contract, API, or docs.
  title: "[feature] "
  labels: ["enhancement"]
  body:
    - type: textarea
      id: problem
      attributes:
        label: Problem
        description: What can't you do today?
      validations:
        required: true

    - type: textarea
      id: proposal
      attributes:
        label: Proposal
      validations:
        required: true

    - type: textarea
      id: alternatives
      attributes:
        label: Alternatives considered

    - type: dropdown
      id: scope
      attributes:
        label: Scope
        options:
          - state machine
          - write lease
          - checkpoint / resume
          - memory router integration
          - CLI / DX
          - docs